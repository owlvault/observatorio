[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-acq-cli"
version = "0.1.0"
description = "Motor de Adquisición de Datos para el Observatorio Regulatorio CRA (Modo Asistido ADR-0008)"
authors = [
    { name = "CRA - Equipo de Datos & Analítica", email = "observatorio@cra.gov.co" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyarrow>=15.0.0",
    "oracledb>=2.1.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
]

[project.scripts]
cra-acq = "cra_acq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
